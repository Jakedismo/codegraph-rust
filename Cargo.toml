[workspace]
members = [
    "crates/codegraph-core",
    "crates/codegraph-vector",
    "crates/codegraph-parser",
    "crates/codegraph-mcp",


    "crates/codegraph-concurrent",
    "crates/codegraph-graph",
    "crates/codegraph-zerocopy",

    "crates/codegraph-mcp-core",
    "crates/codegraph-mcp-tools",
    "crates/codegraph-mcp-rig",
    "crates/codegraph-mcp-server",
    "crates/codegraph-mcp-daemon",
]
exclude = ["scripts", "vendor/rmcp", "vendor/semchunk-rs"]
default-members = [
    "crates/codegraph-core"
]
resolver = "3"


[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
authors = ["CodeGraph Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/codegraph/embedding-system"

# Feature groups for common development scenarios
[workspace.metadata.cargo-features]
# Minimal build for MCP server development (fastest build times)
mcp-minimal = [
    "ai-enhanced",
    "embeddings-ollama"
]

# MCP development with LM Studio support
mcp-lmstudio = [
    "ai-enhanced",
    "embeddings-ollama",
    "embeddings-lmstudio"
]

# Full local stack (no cloud dependencies)
local-stack = [
    "daemon",
    "ai-enhanced",
    "embeddings-ollama",
    "embeddings-lmstudio",
    "embeddings-local"
]

# Cloud-enabled build
cloud-enabled = [
    "daemon",
    "ai-enhanced",
    "cloud",
    "embeddings-jina",
    "server-http"
]

# Everything (development/testing)
full = [
    "daemon",
    "ai-enhanced",
    "cloud",
    "embeddings",
    "embeddings-local",
    "embeddings-openai",
    "embeddings-ollama",
    "embeddings-jina",
    "embeddings-lmstudio",
    "server-http"
]

[workspace.dependencies]
fastrand = "2.5.0"
governor = { version = "0.10.4" }
lazy_static = "1.5.1"
# Async Runtime
tokio = { version = "1.53.2", features = ["full"] }
async-trait = "0.1.92"
futures = "0.3.34"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["http", "fancy-regex", "onig"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9.8"

# Zero-copy serialization
rkyv = { version = "0.8.18", features = ["alloc", "std"] }
bytecheck = "0.8.3"
rend = "0.5.4"

# Error Handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Utilities
regex = "1.13.1"
sha2 = "0.11.0"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }

# Parallel Processing
rayon = "1.12.0"
crossbeam-channel = "0.5.17"
crossbeam-utils = "0.8.23"
crossbeam-queue = "0.3.14"
crossbeam-skiplist = "0.1.3"
arc-swap = "1.9.2"


# System Information
num_cpus = "1.17.0"
sysinfo = "0.39.6"

# Scientific computing
ndarray = "0.17.2"

# OpenAI API client
# Minimize reqwest features for smaller binaries; prefer system TLS
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }

# ONNX ort format
# The ONNX Runtime Rust bindings are still release candidates.
ort = { version = "2.0.0-rc.13", features = [ "load-dynamic" ] }

# Additional utilities
# Bincode 3.0.0 is a tombstone containing only compile_error!; retain the latest usable release.
bincode = { version = "2.0.1", features = ["serde"] }
dashmap = "6.2.1"
parking_lot = "0.12.5"
tokio-util = "0.7.19"
tokio-uring = { version = "0.5.0" }

# File system monitoring and diff processing
notify = "8.2.0"
similar = "3.2.0"
memmap2 = "0.9.11"
flate2 = "1.1.10"
# Compression algorithms
zstd = "0.14.0"
lz4_flex = "0.14.0"

# Version overrides for transitive crates we rely on
cedar-policy = "4.13.0"
cedar-policy-core = "4.13.0"
cedar-policy-validator = "4.4.2"
dirs = "7.0.0"
generic-array = "1.4.5"
matchit = "0.9.2"
pdqselect = "0.1.1"

# Moved MCP crate dependencies
nix = { version = "0.31.3", features = ["process", "signal"] }

globset = "0.4.20"
ignore = "0.4.33"
rand = "0.10.3"

# Git integration
git2 = "0.21.0"

# Tree-sitter for parsing - Enhanced error handling and pooling implemented
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-cpp = "0.23.4"

# Additional language support - Revolutionary universal programming language coverage
tree-sitter-swift = "0.7.4"
tree-sitter-kotlin = "0.3.8"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-dart = "0.2.0"

# GraphQL
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"

# Web framework
axum = "0.8.9"
tower = { version = "0.5.3", features = ["util"] }
tower-http = "0.7.1"
hyper = "1.11.1"
http-body-util = "0.1.5"
http = "1.5.0"

# OpenAPI / Swagger documentation for Axum
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }

# Memory leak detection and tracking (optional, feature-gated in binaries)
memscope-rs = "0.2.5"

# WebSocket support
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
url = "2.5.8"

# Tracing and logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
tracing-indicatif = "0.3.14"
tracing-appender = "0.2.5"
once_cell = "1.21.4"
hashbrown = "0.17.1"
rustc-hash = "2.1.3"
bytes = "1.12.1"

# Memory allocator + profiling
tikv-jemallocator = { version = "0.7.0", default-features = true }
tikv-jemalloc-ctl = "0.7.0"
backtrace = "0.3.76"

# Configuration
schemars = "1.2.2"
base64 = "0.23.1"

# CLI
clap = { version = "4.6.7", features = ["derive", "cargo", "env", "wrap_help"] }
colored = "3.1.1"
indicatif = "0.18.6"
atty = "0.2.14"

# Security
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
argon2 = "0.6.0"

# Testing
tempfile = "3.27.0"
tokio-test = "0.4.6"
approx = "0.5.1"
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }

# LRU cache utility
lru = "0.18.5"

# Internal crates
codegraph-core = { path = "crates/codegraph-core" }
codegraph-graph = { path = "crates/codegraph-graph" }
codegraph-parser = { path = "crates/codegraph-parser" }
codegraph-vector = { path = "crates/codegraph-vector", default-features = false }
codegraph-mcp = { path = "crates/codegraph-mcp" }

codegraph-zerocopy = { path = "crates/codegraph-zerocopy" }



# Development dependencies


[profile.release]
# Performance-oriented release (kept as-is for general builds)
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 0        # Faster compilation (0 = no optimization)
debug = true
incremental = true
codegen-units = 256  # Parallel codegen for faster builds

[profile.test]
opt-level = 1
debug = true

# Super-fast dev profile for rapid iteration
[profile.fast-dev]
inherits = "dev"
opt-level = 0
incremental = true
codegen-units = 256
debug = 1  # Line numbers only, not full debug info
lto = false
panic = "unwind"

# Size-optimized release profile for smallest possible binaries
[profile.release-size]
inherits = "release"
opt-level = "z"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
debug = false
overflow-checks = false
