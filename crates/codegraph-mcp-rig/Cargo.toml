[package]
name = "codegraph-mcp-rig"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Solita CodeGraph"]
license = "Apache-2.0"
description = "Rig-based agent backend for CodeGraph MCP server"

[lib]
path = "src/lib.rs"

[features]
default = []
rig-experimental = []
# Provider features
openai = []
anthropic = []
ollama = []
xai = []

[dependencies]
# Provider contracts and the companion agent runtime split out in Rig 0.43.
rig = { package = "rig-core", version = "0.43.0", features = ["reqwest"] }
rig-agent = "0.43.0"

# Internal shared crates
codegraph-core = { path = "../codegraph-core" }
codegraph-mcp-core = { path = "../codegraph-mcp-core" }
codegraph-mcp-tools = { path = "../codegraph-mcp-tools" }
codegraph-graph = { path = "../codegraph-graph" }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
codegraph-vector = { workspace = true }
