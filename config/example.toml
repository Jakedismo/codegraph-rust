# CodeGraph example configuration.
#
# Copy to ./.codegraph.toml (project) or ~/.codegraph/config.toml (user). The project file
# is used when present; otherwise the user file. A .env file and CODEGRAPH_* environment
# variables override anything set here.
#
# Only keys that change behaviour are shown. The loader also accepts [rerank],
# [performance] and [logging] sections, but nothing outside status output reads them
# today (reranking is configured through JINA_* environment variables; see .env.example).
# Unknown sections and keys are ignored without an error, so check spelling.

[embedding]
provider = "ollama"                    # ollama | lmstudio | jina | openai | onnx
model = "qwen3-embedding:0.6b"
dimension = 1024                       # 384, 768, 1024, 1536, 2048, 2560, 3072, 3584, 4096
batch_size = 64                        # max texts per request; env and --batch-size override
ollama_url = "http://localhost:11434"
# lmstudio_url = "http://localhost:1234"
# jina_api_base = "https://api.jina.ai/v1"
# jina_task = "auto"                     # v4: code.passage; v3/v5: retrieval.passage; JINA_API_TASK overrides
# jina_late_chunking = false

# LLM for the agentic tools. Each key is used unless the matching environment variable
# is set: CODEGRAPH_LLM_PROVIDER, CODEGRAPH_LLM_MODEL, CODEGRAPH_CONTEXT_WINDOW.
# API keys are read from the environment only (ANTHROPIC_API_KEY, OPENAI_API_KEY, XAI_API_KEY).
[llm]
enabled = true                         # false makes the agent ignore this whole section
provider = "ollama"                    # ollama | lmstudio | anthropic | openai | xai | openai-compatible
model = "qwen2.5-coder:14b"
context_window = 32768                 # your model's real token limit; selects the prompt tier
# ollama_url = "http://localhost:11434"
# lmstudio_url = "http://localhost:1234"
# openai_compatible_url = "http://localhost:8000/v1"

[indexing]
tier = "fast"                          # fast | balanced | full

[daemon]
auto_start_with_mcp = true             # start the file watcher with `codegraph start --watch`
debounce_ms = 30
batch_timeout_ms = 200
exclude_patterns = ["**/node_modules/**", "**/target/**", "**/.git/**", "**/dist/**"]
# languages = ["rust", "typescript"]

# Storage has no section here: each project uses an embedded store at <project>/.codegraph/db
# unless CODEGRAPH_SURREALDB_URL points at a SurrealDB server.
